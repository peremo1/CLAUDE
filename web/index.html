    </div>
    <div class="field" data-mode="login register forgot"><label for="auEmail" data-t="email"></label><input type="email" id="auEmail" autocomplete="email" maxlength="200"><span class="err" data-err="email"></span></div>
    <div class="field" data-mode="code"><label for="auCode" data-t="codeLabel"></label><input type="text" id="auCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="font-size:1.4rem;letter-spacing:.4em;text-align:center"><span class="err" data-err="code"></span></div>
    <div class="field" data-mode="login register code"><label for="auPass" id="auPassLbl" data-t="password"></label><input type="password" id="auPass" autocomplete="current-password" maxlength="200"><small data-mode="register code" data-t="passHelp"></small><span class="err" data-err="password"></span></div>
    <label class="check" data-mode="register"><input type="checkbox" id="auAge"><span data-t="ageConfirm"></span></label>
    <button class="btn primary" id="authGo"></button>
    <div class="auth-switch" data-mode="login"><button type="button" class="link-btn" data-auth="forgot" data-t="forgotQ"></button></div>
    <div class="auth-switch" data-mode="login"><span data-t="noAccount"></span><button type="button" class="link-btn" data-auth="register" data-t="createAccount"></button></div>
    <div class="auth-switch" data-mode="code"><span data-t="noCodeQ"></span><button type="button" class="link-btn" id="resendCode" data-t="resendCode"></button></div>
    <div class="auth-switch" data-mode="register forgot code"><span data-t="haveAccountQ"></span><button type="button" class="link-btn" data-auth="login" data-t="logIn"></button></div>
  </form>
</dialog>

<dialog id="workDlg" class="mid"><form class="dlg-pad" id="workForm" novalidate></form></dialog>
<dialog id="confirmDlg" class="small"><div class="dlg-pad"><h2 id="cfTitle" style="font-size:1.6rem"></h2><p class="muted" id="cfText"></p><div class="field" id="cfPassWrap" hidden><label for="cfPass" data-t="password"></label><input type="password" id="cfPass" autocomplete="current-password"><span class="err" id="cfErr"></span></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn danger" id="cfOk"></button><button class="btn ghost" data-close data-t="cancel"></button></div></div></dialog>
<dialog id="lightbox" class="lightbox"><button class="round close" data-close aria-label="Cerrar"><svg class="i"><use href="#x"/></svg></button><img id="lbImg" alt=""></dialog>

<div class="toast" id="toast" hidden role="status"><svg><use href="#spark"/></svg><span></span></div>
</body>
</html>
