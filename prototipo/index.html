<style>
/* Layout: una franja con la mirada del personaje abre la página; debajo, galería en columnas tipo muro. Todo lo demás, silencioso. */
:root {
  color-scheme: dark;
  --ink: #140b1a;        /* fondo: sombra violeta casi negra */
  --panel: #1e1227;      /* superficies */
  --line: #36233f;       /* bordes */
  --violet: #a42fcb;     /* fondo y máscara del personaje */
  --violet-deep: #6c108d;
  --hair: #eee3ec;       /* texto: el pelo lavanda */
  --muted: #a893ae;
  --eye: #ffd10b;        /* ojos: solo para lo importante */
  --on-eye: #1c1206;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --r-s: 3px;
  --r-m: 10px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--ink); color: var(--hair);
  font: 400 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--eye); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: clamp(2.2rem, 5vw, 3.4rem); }
h3 { font-size: 1.6rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }

/* botones */
.btn { white-space: nowrap; display: inline-flex; align-items: center; gap: .5em; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .55em 1.1em; cursor: pointer; text-decoration: none; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--eye); color: var(--on-eye); border-color: var(--eye); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.violet { background: var(--violet); border-color: var(--violet); color: #fff; }
.icon-btn { display: inline-flex; align-items: center; gap: .45em; background: none; border: 0; padding: .4em .2em; cursor: pointer; color: var(--hair); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-pressed="true"] { color: var(--eye); }
.icon-btn[aria-pressed="true"] svg { fill: currentColor; }

/* cabecera */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
.top .wrap { display: flex; align-items: center; gap: 24px; height: 60px; }
.mark { font-family: var(--display); font-weight: 800; font-size: 1.7rem; text-decoration: none; display: flex; align-items: center; gap: 6px; }
.mark svg { width: 14px; height: 14px; color: var(--eye); }
nav.main { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
nav.main a { text-decoration: none; padding: .4em .8em; border-radius: 999px; color: var(--muted); white-space: nowrap; }
nav.main a[aria-current="page"] { color: var(--hair); background: var(--panel); }
.top .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { background: none; border: 0; padding: .3em .7em; cursor: pointer; color: var(--muted); font-size: .85rem; font-weight: 600; }
.lang button[aria-pressed="true"] { background: var(--hair); color: var(--ink); }
.me { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); }
.unread { display: inline-block; min-width: 1.3em; padding: 0 .35em; margin-left: .3em; border-radius: 999px; background: var(--eye); color: var(--on-eye); font-size: .72rem; font-weight: 700; text-align: center; line-height: 1.3em; }

/* hero: la mirada */
.hero { padding-block: 28px 8px; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 32px; align-items: end; }
.gaze { position: relative; aspect-ratio: 8 / 3; max-width: 100%; border-radius: var(--r-s); background-image: url("avatar.jpg"); background-size: 130% auto; background-position: 40% 46%; overflow: hidden; }
.gaze::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(20,11,26,.85)); }
.gaze h1 { position: absolute; z-index: 1; left: clamp(14px, 3vw, 36px); bottom: clamp(6px, 1.5vw, 18px); font-size: clamp(4.5rem, 12vw, 10rem); line-height: .8; color: var(--hair); }
.intro { display: grid; gap: 20px; justify-items: start; }
.intro p { max-width: 46ch; font-size: 1.08rem; }
.intro .actions { display: flex; flex-wrap: wrap; gap: 10px; }
.status { display: inline-flex; align-items: center; gap: .45em; font-size: .9rem; color: var(--muted); }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--eye); }

/* galería */
section.view { padding-block: 32px 96px; }
.gal-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: .3em .9em; cursor: pointer; color: var(--muted); font-size: .92rem; }
.chip[aria-pressed="true"] { color: var(--hair); border-color: var(--hair); }
.wall { columns: 3 260px; column-gap: 14px; }
.tile { display: block; width: 100%; break-inside: avoid; margin: 0 0 14px; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; position: relative; }
.tile .art { border-radius: var(--r-s); overflow: hidden; position: relative; }
.tile .frame, .tile .frame > * { display: block; width: 100%; }
.tile .cap { display: flex; justify-content: space-between; gap: 8px; padding: 8px 2px 0; font-size: .92rem; }
.tile .cap span:last-child { color: var(--muted); display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.tile .cap svg { width: 15px; height: 15px; }
.blurred { filter: blur(26px) saturate(.8); transform: scale(1.1); }
.veil { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--hair); font-size: .9rem; z-index: 1; }
.veil span { background: color-mix(in srgb, var(--ink) 78%, transparent); padding: 10px 18px 12px; border-radius: var(--r-m); }
.veil b { font-family: var(--display); font-size: 2rem; display: block; }
.tag18 { position: absolute; top: 8px; left: 8px; z-index: 1; background: var(--ink); color: var(--hair); font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.sample { position: absolute; right: 8px; bottom: 8px; z-index: 1; font-size: .72rem; color: rgba(255,255,255,.75); }

/* diálogos */
dialog { border: 1px solid var(--line); background: var(--ink); color: var(--hair); border-radius: var(--r-m); padding: 0; max-width: min(1100px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); width: 100%; }
dialog::backdrop { background: rgba(10,5,14,.82); }
dialog.small { max-width: 440px; }
.dlg-pad { padding: 28px; display: grid; gap: 16px; }
.close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--panel); cursor: pointer; display: grid; place-items: center; }
.close svg { width: 18px; height: 18px; }
.detail { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); position: relative; }
.detail .pic { background: #0c0610; display: grid; place-items: center; min-height: 320px; }
.detail .pic > * { max-height: calc(100dvh - 34px); width: 100%; object-fit: contain; }
.detail .side { padding: 28px 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; max-height: calc(100dvh - 34px); overflow-y: auto; }
.detail .bar { display: flex; flex-wrap: wrap; gap: 6px 16px; border-block: 1px solid var(--line); padding-block: 8px; font-variant-numeric: tabular-nums; }
.share { display: flex; flex-wrap: wrap; gap: 8px; }
.share[hidden] { display: none; }
.comments { display: grid; gap: 14px; }
.comment { display: grid; grid-template-columns: 32px 1fr; gap: 10px; }
.comment .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: .85rem; background: var(--panel); color: var(--muted); }
.comment .av.artist { background: var(--violet); color: #fff; }
.comment p { font-size: .95rem; }
.comment .who { font-size: .85rem; color: var(--muted); }
.comment .who b { color: var(--hair); font-weight: 600; }
.badge { font-size: .72rem; padding: 0 6px; border-radius: 999px; background: var(--violet); color: #fff; margin-left: 4px; }

/* formularios */
.field { display: grid; gap: 6px; }
.field label, .field legend { font-weight: 500; font-size: .95rem; }
.field small { color: var(--muted); font-size: .85rem; }
input[type=text], input[type=email], input[type=password], textarea, select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-s); padding: .65em .8em; }
textarea { min-height: 120px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--violet); outline: none; }
.drop { border: 1px dashed var(--line); border-radius: var(--r-s); padding: 22px; text-align: center; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: .35em; accent-color: var(--eye); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--hair); color: var(--ink); padding: .6em 1.2em; border-radius: 999px; font-weight: 600; z-index: 30; }

/* comisiones */
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 48px; align-items: start; }
.steps { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 18px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--violet); }
.steps b { display: block; font-weight: 600; }
.steps span { color: var(--muted); font-size: .95rem; }
form.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); padding: 26px; display: grid; gap: 18px; }
form.card input[type=text], form.card textarea, form.card select { background: var(--ink); }
.gate-note { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); padding: 26px; display: grid; gap: 14px; justify-items: start; }

/* tablas de pedidos */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-m); }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: .95rem; }
th { color: var(--muted); font-weight: 500; }
tr:last-child td { border-bottom: 0; }
.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; border: 1px solid var(--line); }
.pill.new { background: var(--eye); color: var(--on-eye); border-color: var(--eye); }
.pill.quoted { border-color: var(--violet); color: var(--hair); }
.pill.doing { background: var(--violet); color: #fff; border-color: var(--violet); }
.pill.done { color: var(--muted); }

/* mensajes */
.inbox { display: grid; grid-template-columns: 280px minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; min-height: 460px; }
.threads { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.threads button { display: grid; grid-template-columns: 36px 1fr; gap: 10px; text-align: left; padding: 14px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; }
.threads button[aria-current="true"] { background: var(--panel); }
.threads .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); color: var(--muted); font-weight: 600; }
.threads small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread { display: flex; flex-direction: column; min-width: 0; }
.msgs { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 75%; padding: .6em .9em; border-radius: 14px; background: var(--panel); font-size: .95rem; }
.msg.mine { align-self: flex-end; background: var(--violet-deep); }
.msg time { display: block; font-size: .75rem; color: var(--muted); margin-top: 2px; }
.compose { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.compose input { flex: 1; min-width: 0; }

/* panel del artista */
.stats { display: flex; flex-wrap: wrap; gap: 40px; margin: 22px 0 36px; }
.stats div { display: grid; }
.stats b { font-family: var(--display); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stats span { color: var(--muted); font-size: .9rem; }

/* aviso de edad */
.age { position: fixed; inset: 0; z-index: 40; background: var(--ink); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
.age .box { max-width: 460px; display: grid; gap: 18px; text-align: left; }
.age .box img { width: 84px; height: 84px; border-radius: 50%; }
.age h2 { font-size: clamp(2.4rem, 8vw, 3.4rem); }
.age .actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* barra de boceto */
.demo { position: fixed; z-index: 20; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--hair); color: var(--ink); border-radius: 999px; padding: 4px 4px 4px 14px; display: flex; align-items: center; gap: 6px; font-size: .82rem; max-width: calc(100vw - 24px); }
.demo button { border: 0; background: none; color: var(--ink); padding: .35em .8em; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .82rem; }
.demo button[aria-pressed="true"] { background: var(--ink); color: var(--hair); }

footer.foot { border-top: 1px solid var(--line); padding-block: 24px 80px; color: var(--muted); font-size: .9rem; }
footer.foot .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; }
footer.foot nav { display: flex; flex-wrap: wrap; gap: 16px; }

@media (max-width: 820px) {
  .detail { grid-template-columns: 1fr; }
  .detail .side { max-height: none; }
  .detail .pic > * { max-height: 70dvh; }
  dialog { max-height: calc(100dvh - 16px); overflow-y: auto; }
  .two, .hero { grid-template-columns: 1fr; gap: 32px; }
  .hero { gap: 20px; }
  .inbox { grid-template-columns: 1fr; }
  .threads { border-right: 0; border-bottom: 1px solid var(--line); }
  .row2 { grid-template-columns: 1fr; }
  .gaze { aspect-ratio: 2 / 1; background-size: 200% auto; background-position: 35% 44%; }
}
@media (max-width: 560px) {
  .top .wrap { gap: 0 12px; flex-wrap: wrap; height: auto; padding-top: 10px; }
  nav.main { order: 3; width: 100%; margin: 6px -4px 0; padding-bottom: 8px; }
  .top .right .btn { padding: .45em .8em; }
  .wall { columns: 2; column-gap: 10px; }
  .tile { margin-bottom: 10px; }
  .tile .cap { font-size: .82rem; }
  .demo > span { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .gaze { animation: open 1.1s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes open { from { clip-path: inset(48% 0 48% 0); } to { clip-path: inset(0 0 0 0); } }
}
</style>

};
const detectLang = () => ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
const S = { lang: store.get("zaber-lang") || detectLang(), role: "guest", filter: "all", liked: new Set(), saved: new Set(), revealed: new Set(), current: null, thread: 0 };
const t = k => T[S.lang][k] ?? k;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Obras de ejemplo: la primera es la ilustración real; el resto son manchas de color con la paleta del personaje.
const WORKS = [

  w4: [{ who: "Lune", text: { es: "La luz está increíble.", en: "The lighting is incredible." } }],
};
function artCSS(n) {
  const P = ["#8e22b3", "#6c108d", "#b340cf", "#e9d9e4", "#ffd10b", "#2a1433", "#c66acd"];
  const r = i => ((Math.sin(n * 97.13 + i * 13.7) + 1) / 2);
  const g = [];
  for (let i = 0; i < 3; i++) g.push(`radial-gradient(${Math.round(18 + r(i) * 26)}% ${Math.round(18 + r(i + 9) * 26)}% at ${Math.round(15 + r(i + 3) * 70)}% ${Math.round(15 + r(i + 6) * 70)}%, ${P[(n + i) % 7]} 0 58%, transparent 60%)`);
  return g.join(",") + `, linear-gradient(${Math.round(r(20) * 360)}deg, ${P[(n + 1) % 2]}, #1a0d22)`;
}
const fmtDate = d => new Intl.DateTimeFormat(S.lang, { day: "numeric", month: "long", year: "numeric" }).format(new Date(d + "T12:00:00"));
const fmtNum = n => new Intl.NumberFormat(S.lang).format(n);
const likes = w => w.likes + (S.liked.has(w.id) ? 1 : 0);
const canSeeNsfw = w => !w.nsfw || S.revealed.has(w.id);

function picHTML(w) {
  const st = `aspect-ratio:${w.ratio};max-width:100%`;
  return w.img ? `<img src="${w.img}" alt="${esc(w.title[S.lang])}" style="${st}">` : `<div style="${st};background:${artCSS(w.art)}" role="img" aria-label="${esc(w.title[S.lang])}"></div>`;
}

function renderWall() {
  let list = WORKS;
  if (S.filter === "sfw") list = list.filter(w => !w.nsfw);
  if (S.filter === "nsfw") list = list.filter(w => w.nsfw);
  if (S.filter === "saved") list = list.filter(w => S.saved.has(w.id));
  $("#wall").innerHTML = list.map(w => {
    const hide = !canSeeNsfw(w);
    return `<button class="tile" data-id="${w.id}">
      <div class="art">${w.nsfw ? '<span class="tag18">+18</span>' : ""}
        <div class="frame ${hide ? "blurred" : ""}">${picHTML(w)}</div>
        ${hide ? `<div class="veil"><span><b>+18</b>${t("reveal")}</span></div>` : ""}
        ${w.img ? "" : `<span class="sample">${t("sample")}</span>`}
      </div>
      <div class="cap"><span>${esc(w.title[S.lang])}</span><span><svg><use href="#i-heart"/></svg>${fmtNum(likes(w))}</span></div>
    </button>`;
  }).join("");
  $("#wallEmpty").hidden = list.length > 0;
  $("#wallEmpty").textContent = t("emptySaved");
}

function openDetail(id) {
  const w = WORKS.find(x => x.id === id); S.current = w; S.revealed.add(id);
  $("#dPic").innerHTML = picHTML(w);
  $("#dTitle").textContent = w.title[S.lang];
  $("#dDate").textContent = fmtDate(w.date) + (w.nsfw ? "   +18" : "");
  $("#dDesc").textContent = w.desc[S.lang];
  $("#dLike").setAttribute("aria-pressed", S.liked.has(id));
  $("#dLikes").textContent = fmtNum(likes(w));
  $("#dSave").setAttribute("aria-pressed", S.saved.has(id));
  $("#dSave span").textContent = S.saved.has(id) ? t("saved") : t("save");
  $("#shareBox").hidden = true; $("#dShare").setAttribute("aria-expanded", "false");
  const url = encodeURIComponent("https://zaber.art/obra/" + id), txt = encodeURIComponent(w.title[S.lang] + " de Zaber");
  $("#shX").href = `https://x.com/intent/post?text=${txt}&url=${url}`;
  $("#shBs").href = `https://bsky.app/intent/compose?text=${txt}%20${url}`;
  $("#shRd").href = `https://www.reddit.com/submit?url=${url}&title=${txt}`;
  renderComments();
  if (!$("#detail").open) $("#detail").showModal();
  renderWall();
}
function renderComments() {
  const list = COMMENTS[S.current.id] || [];
  $("#dCount").textContent = list.length;
  $("#dComments").innerHTML = list.map(c => `<div class="comment"><div class="av ${c.artist ? "artist" : ""}">${esc(c.who[0])}</div><div><div class="who"><b>${esc(c.who)}</b>${c.artist ? `<span class="badge">${t("artistBadge")}</span>` : ""}</div><p>${esc(typeof c.text === "string" ? c.text : c.text[S.lang])}</p></div></div>`).join("");
}

function needLogin() { if (S.role === "guest") { $("#login").showModal(); return true; } return false; }
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => el.hidden = true, 2400); }

function renderCommission() {
  const box = $("#comSide");
  if (S.role === "guest") {
    box.innerHTML = `<div class="gate-note"><h3>${t("needAccount")}</h3><p class="muted">${t("needAccountText")}</p><button class="btn primary" data-open-login>${t("createAccount")}</button></div>`;

    return;
  }
  // Un fan solo ve su conversación con Zaber; Zaber ve la bandeja completa.
  const threads = S.role === "artist" ? THREADS : [{ who: "Zaber", msgs: THREADS[0].msgs.map(m => ({ ...m, me: !m.me })) }];
  const th = threads[Math.min(S.thread, threads.length - 1)];
  box.innerHTML = `<div class="inbox">
    <div class="threads">${threads.map((x, i) => `<button data-thread="${i}" aria-current="${x === th}"><span class="av">${x.who[0]}</span><span><b>${x.who}</b><small>${esc(x.msgs[x.msgs.length - 1].text[S.lang])}</small></span></button>`).join("")}</div>

    renderMessages(); $("#msgIn").focus();

}

const REQS = [
  { who: "Mika", what: { es: "Personaje solo, +18", en: "Single character, 18+" }, date: "2026-10-16", st: "new" },
  { who: "r0nin", what: { es: "Escena con fondo", en: "Scene with background" }, date: "2026-10-14", st: "quoted" },
  { who: "Lune", what: { es: "Dos personajes", en: "Two characters" }, date: "2026-10-05", st: "doing" },
  { who: "Kai", what: { es: "Icono", en: "Icon" }, date: "2026-09-22", st: "done" },
];
function renderPanel() {
  const stLabel = { new: "stNew", quoted: "stQuoted", doing: "stDoing", done: "stDone" };
  $("#stats").innerHTML = [[fmtNum(4820), "stLikes"], [fmtNum(1312), "stFollowers"], ["1", "stReq"], ["2", "stMsg"]].map(([n, k]) => `<div><b>${n}</b><span>${t(k)}</span></div>`).join("");
  $("#reqTable").innerHTML = `<thead><tr><th>${t("rWho")}</th><th>${t("rWhat")}</th><th>${t("rDate")}</th><th>${t("rState")}</th></tr></thead><tbody>` +
    REQS.map(r => `<tr><td>${r.who}</td><td>${r.what[S.lang]}</td><td>${fmtDate(r.date)}</td><td><span class="pill ${r.st}">${t(stLabel[r.st])}</span></td></tr>`).join("") + "</tbody>";
}

function route() {
  let r = location.hash.slice(1) || "galeria";
  if (r === "panel" && S.role !== "artist") r = "galeria";
  if (!document.querySelector(`[data-view="${r}"]`)) r = "galeria";
  document.querySelectorAll("[data-view]").forEach(v => v.hidden = v.dataset.view !== r);
  document.querySelectorAll("nav.main a").forEach(a => a.dataset.route === r ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  if (r === "comisiones") renderCommission();
  if (r === "mensajes") renderMessages();
  if (r === "panel") renderPanel();
  window.scrollTo(0, 0);
}

function applyLang() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === S.lang));
  renderWall(); route();
  if ($("#detail").open) openDetail(S.current.id);
}
function applyRole() {
  document.querySelectorAll("[data-role]").forEach(b => b.setAttribute("aria-pressed", b.dataset.role === S.role));
  $("#navPanel").hidden = S.role !== "artist";
  $("#unread").hidden = S.role !== "artist";
  $("#loginBtn").hidden = S.role !== "guest";
  $("#meAv").hidden = S.role === "guest";
  $("#meAv").src = S.role === "artist" ? "avatar.jpg" : "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34"><rect width="34" height="34" fill="#36233f"/><text x="17" y="22" font-family="sans-serif" font-size="14" font-weight="600" fill="#eee3ec" text-anchor="middle">M</text></svg>');
  S.thread = 0; route();
}

// eventos
$("#wall").addEventListener("click", e => { const b = e.target.closest(".tile"); if (b) openDetail(b.dataset.id); });
$("#filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  if (b.dataset.f === "saved" && needLogin()) return;
  S.filter = b.dataset.f;
  document.querySelectorAll("#filters .chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  renderWall();
});
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { S.lang = b.dataset.lang; store.set("zaber-lang", S.lang); applyLang(); }));
document.querySelectorAll("[data-role]").forEach(b => b.addEventListener("click", () => { S.role = b.dataset.role; applyRole(); }));
document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) e.target.closest("dialog").close();
  if (e.target.closest("[data-open-login]")) $("#login").showModal();
  const th = e.target.closest("[data-thread]"); if (th) { S.thread = +th.dataset.thread; renderMessages(); }
});
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));
$("#loginBtn").addEventListener("click", () => $("#login").showModal());
[$("#lgGo"), $("#lgGo2")].forEach(b => b.addEventListener("click", () => { $("#login").close(); S.role = "fan"; applyRole(); toast(t("welcome")); }));
$("#dLike").addEventListener("click", () => {
  if (needLogin()) return; const id = S.current.id;
  S.liked.has(id) ? S.liked.delete(id) : S.liked.add(id); openDetail(id);
});
$("#dSave").addEventListener("click", () => {
  if (needLogin()) return; const id = S.current.id;
  S.saved.has(id) ? S.saved.delete(id) : S.saved.add(id); openDetail(id);
});
$("#dShare").addEventListener("click", () => { const box = $("#shareBox"); box.hidden = !box.hidden; $("#dShare").setAttribute("aria-expanded", String(!box.hidden)); });
$("#shCopy").addEventListener("click", () => {
  const link = "https://zaber.art/obra/" + S.current.id;
  navigator.clipboard?.writeText(link).then(() => toast(t("copied")), () => toast(link));
});
$("#cForm").addEventListener("submit", e => {
  e.preventDefault(); if (needLogin()) return;
  const v = $("#cText").value.trim(); if (!v) return;
  (COMMENTS[S.current.id] ||= []).push({ who: S.role === "artist" ? "Zaber" : "Mika", artist: S.role === "artist", text: v });
  $("#cText").value = ""; renderComments(); toast(t("posted"));
});
$("#uploadForm").addEventListener("submit", e => { e.preventDefault(); toast(t("published")); });
window.addEventListener("hashchange", route);

// aviso de edad
if (store.get("zaber-18") !== "yes") $("#age").hidden = false;
$("#ageYes").addEventListener("click", () => { store.set("zaber-18", "yes"); $("#age").hidden = true; });
$("#ageNo").addEventListener("click", () => { $("#ageBye").hidden = false; });

applyLang(); applyRole();
</script>
